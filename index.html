.loginbox{position:relative;width:39vw;max-width:600px;min-width:360px;margin-left:54%;margin-top:2%;padding:0;background:transparent;border:0;box-shadow:none}.brand{display:none}.brand img{width:62px;height:62px;object-fit:contain}.brand h1{margin:0;color:var(--b);font-size:22px}.brand p{margin:3px 0;color:var(--mut);font-size:13px}.field{margin:12px 0 14px}label{display:none}input,select,textarea{width:100%;padding:14px 15px;border:1px solid transparent;border-radius:10px;background:#ffffff00;color:#4a4545;font-size:17px}textarea{min-height:85px}.pw{position:relative}.pw button{position:absolute;right:5px;top:5px;border:0;background:none;cursor:pointer;padding:7px}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer;min-height:54px}.primary{background:#69152b;color:#fff}.secondary{background:var(--be);color:var(--b)}.ghost{background:transparent;color:var(--b);border:1px solid var(--line)}.danger{background:#a82d40;color:#fff}.err{height:19px;color:#a82d40;font-size:13px;text-align:center}.creator{text-align:center;margin-top:118px;color:#6b172c;font-size:11px;font-weight:600}
.app{display:none;min-height:100vh}.top{height:72px;background:var(--b);color:white;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:10}.topbrand{display:flex;align-items:center;gap:10px}.topbrand img{width:50px;height:50px;background:#fff;border-radius:9px;padding:3px;object-fit:contain}.topbrand strong{display:block}.topbrand small{opacity:.75}.layout{display:flex;min-height:calc(100vh - 72px)}aside{width:235px;background:#fffaf4;border-right:1px solid var(--line);padding:12px;flex-shrink:0}.navtitle{font-size:10px;font-weight:900;color:#988980;margin:14px 7px 5px;text-transform:uppercase}.nav{width:100%;padding:10px;border:0;background:none;text-align:left;border-radius:9px;cursor:pointer;color:#4d3e3a;font-weight:650}.nav:hover,.nav.on{background:var(--be);color:var(--b)}main{flex:1;padding:22px;overflow:auto}.head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:18px}h2{margin:0;color:var(--b)}.sub{font-size:13px;color:var(--mut)}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:13px;margin-bottom:18px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 3px 12px #4d0e2010}.metric{font-size:25px;font-weight:900;color:var(--b);margin-top:7px}.panel{margin-bottom:17px}.panel h3{margin:0 0 12px;color:var(--b)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar input,.toolbar select{max-width:240px}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #eee;text-align:left;font-size:13px}th{color:#76665f;background:#fffaf6}.tag{display:inline-block;padding:4px 8px;border-radius:20px;background:var(--be);color:var(--b);font-size:11px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:18px;z-index:50}.modal.show{display:flex}.modalbox{width:min(620px,96vw);max-height:90vh;overflow:auto;background:#fffaf4;border-radius:16px;padding:20px}.toast{position:fixed;right:18px;bottom:18px;background:var(--b);color:white;padding:11px 15px;border-radius:10px;display:none;z-index:60}
@media(max-width:800px){.loginbox{width:70vw;min-width:280px;margin-left:25%;margin-top:0}.creator{margin-top:85px}aside{width:66px;padding:7px}.nav{font-size:0;text-align:center}.navtitle{display:none}main{padding:13px}.top{padding:0 9px}.topbrand small{display:none}.topbrand strong{font-size:13px}}

/* ===== C.P.O. SCHOOL — INTERFACE PROFESSIONNELLE ===== */
:root{--b:#69152b;--b2:#8d2942;--be:#f6eadf;--bg:#f7f8fb;--ink:#29252a;--mut:#746b70;--line:#e5e1e4;--white:#fff;--green:#18865b;--orange:#b7791f;--red:#b4233c}
body{background:#f5f6f8;color:var(--ink)}
.app{background:#f5f6f8}
.top{height:68px;background:#fff;color:var(--ink);padding:0 22px;border-bottom:1px solid #e8e5e7;box-shadow:0 2px 10px #0000000a;position:sticky;top:0;z-index:20}
.topbrand{gap:11px}.topbrand img{width:42px;height:42px;border-radius:10px;border:1px solid #eee;padding:2px}.topbrand strong{font-size:15px;color:var(--b)}.topbrand small{color:#8a8085;opacity:1;font-size:11px}
.top>div:last-child{display:flex;align-items:center;gap:10px}.top .btn{min-height:38px;padding:8px 12px;font-size:12px}
#who{font-size:12px;font-weight:800;color:#5c5257;background:#f5f2f3;border:1px solid #e7e2e5;border-radius:20px;padding:8px 12px}
.layout{min-height:calc(100vh - 68px)}
aside{width:245px;background:#fff;border-right:1px solid #e7e3e6;padding:15px 12px;box-shadow:2px 0 10px #00000004;overflow-y:auto}
.navtitle{font-size:10px;letter-spacing:.08em;font-weight:900;color:#a0979c;margin:18px 9px 7px}.navtitle:first-child{margin-top:4px}
.nav{display:flex;align-items:center;width:100%;min-height:42px;padding:9px 12px;margin:2px 0;border:0;background:transparent;text-align:left;border-radius:10px;cursor:pointer;color:#554c51;font-weight:700;font-size:13px;transition:.15s}
.nav:hover{background:#faf4f6;color:var(--b)}.nav.on{background:#f3e5ea;color:var(--b);box-shadow:inset 3px 0 0 var(--b)}
main{padding:26px 30px;max-width:1500px;width:100%;margin:0 auto}
.head{min-height:54px;margin-bottom:20px;align-items:flex-end}.head h2{font-size:24px;letter-spacing:-.02em}.sub{margin-top:4px;color:#81777c;font-size:13px}
.cards{gap:15px;margin-bottom:22px}.card,.panel{background:#fff;border:1px solid #e7e3e6;border-radius:15px;padding:18px;box-shadow:0 4px 16px #24101808}.card{transition:transform .15s,box-shadow .15s}.card:hover{transform:translateY(-1px);box-shadow:0 7px 20px #2410180e}.metric{font-size:28px;color:var(--b);margin-top:9px}
.grid{gap:16px}.panel{margin-bottom:18px}.panel h3{font-size:15px;margin-bottom:10px}.toolbar{gap:10px;margin-bottom:15px;align-items:center}.toolbar input,.toolbar select{max-width:260px}
input,select,textarea{background:#fff;border:1px solid #ddd7da;border-radius:9px;color:#322d31;font-size:14px;padding:11px 12px;outline:none;transition:.15s}input:focus,select:focus,textarea:focus{border-color:#b8798c;box-shadow:0 0 0 3px #69152b12}
.btn{border:0;border-radius:9px;padding:9px 13px;min-height:38px;font-size:13px;font-weight:800;cursor:pointer;transition:.15s}.btn:hover{transform:translateY(-1px)}.primary{background:var(--b);color:#fff}.secondary{background:#f2e7eb;color:var(--b)}.ghost{background:#fff;color:var(--b);border:1px solid #ddd2d7}.danger{background:#b4233c;color:#fff}
table{background:#fff;border:1px solid #ebe7e9;border-radius:12px;overflow:hidden;display:table}th,td{padding:12px 13px;font-size:13px;border-bottom:1px solid #eee}th{background:#faf8f9;color:#766c72;font-size:11px;text-transform:uppercase;letter-spacing:.04em}tr:last-child td{border-bottom:0}tbody tr:hover,tr:not(:first-child):hover td{background:#fcfafb}
.tag{background:#f3e5ea;color:var(--b);padding:5px 9px;font-size:11px}.modal{background:#1d172099;backdrop-filter:blur(2px)}.modalbox{width:min(680px,95vw);background:#fff;border-radius:18px;padding:24px;box-shadow:0 20px 70px #0004}.toast{right:22px;bottom:22px;border-radius:12px;box-shadow:0 8px 28px #0003}
/* dashboard */
.quick-title{font-size:15px;font-weight:900;color:#3c3438;margin:2px 0 12px}.quick-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:20px}.quick-action{display:flex;align-items:center;gap:12px;text-align:left;background:#fff;border:1px solid #e6e1e4;border-radius:13px;padding:13px 14px;cursor:pointer;box-shadow:0 3px 12px #00000007;transition:.15s}.quick-action:hover{border-color:#cba7b2;transform:translateY(-1px);box-shadow:0 6px 18px #0000000c}.quick-icon{width:38px;height:38px;border-radius:10px;background:#f3e5ea;display:grid;place-items:center;font-size:19px;flex:none}.quick-action b{font-size:13px;color:#332c30}.quick-action span{display:block;font-size:11px;color:#8a8085;margin-top:2px}
.sync-mini{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;padding:7px 10px;border-radius:18px;background:#f4f1f2;color:#655b60;border:1px solid #e6e1e4}.sync-dot{width:7px;height:7px;border-radius:50%;background:#18a06a}
@media(max-width:900px){aside{width:205px}main{padding:20px}.top{padding:0 12px}}
@media(max-width:700px){.topbrand small{display:none}.topbrand strong{font-size:13px}#who{display:none}aside{width:72px;padding:10px 7px}.nav{font-size:0;justify-content:center;padding:10px}.navtitle{display:none}.nav.on{box-shadow:none}.nav::first-letter{font-size:20px}main{padding:16px}.head{align-items:flex-start;flex-direction:column}.head h2{font-size:21px}.quick-grid{grid-template-columns:1fr 1fr}}
</style></head><body>

function teacherRows(init){let q=(document.getElementById("tq")?.value||"").toLowerCase(),m=["Administrateur","Direction","Surveillant Général","Surveillant secondaire"].includes(me.r),r=db.teachers.filter(t=>(t.nom+" "+t.prenom+" "+t.matiere).toLowerCase().includes(q));let h=`<table><tr><th>Nom</th><th>Matière</th><th>Téléphone</th><th>Classes</th><th>État</th><th></th></tr>${r.map(t=>`<tr><td>${esc(t.prenom)} ${esc(t.nom)}</td><td>${esc(t.matiere)}</td><td>${esc(t.tel)}</td><td>${esc(t.classes)}</td><td>${esc(t.etat)}</td><td>${m?`<button class="btn ghost" onclick="teacherModal(${t.id})">Modifier</button><button class="btn danger" onclick="del('teachers',${t.id})">Supprimer</button>`:""}</td></tr>`).join("")}</table>`;if(init)return h;document.getElementById("tt").innerHTML=h}
function emargement(){
  const canEdit=['Administrateur','Direction','Surveillant Général','Surveillant secondaire','Enseignant'].includes(me.r);
  const isTeacher=me.r==='Enseignant';
  const rows=(db.emargement||[]).slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.heure||'').localeCompare(a.heure||''));
  return head('Émargement des enseignants','Date, heure de cours, nombre d’heures, classe et présence',canEdit?`<button class="btn primary" onclick="emargementModal()">+ Nouvel émargement</button>`:'')+
  `<div class="panel"><div class="toolbar"><span class="tag">${rows.length} émargement(s)</span></div><table><tr><th>Date</th><th>Heure de cours</th><th>Nombre d'heures</th><th>Classe</th><th>Enseignant</th><th>Présence</th><th></th></tr>${rows.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.heure)}</td><td>${esc(x.nbHeures)}</td><td>${esc(x.classe)}</td><td>${esc(x.enseignant)}</td><td>${x.present==='Présent'?'🟢 Présent':'🔴 Absent'}</td><td>${canEdit?`<button class="btn danger" onclick="del('emargement',${x.id})">Supprimer</button>`:''}</td></tr>`).join('')||'<tr><td colspan="7">Aucun émargement enregistré.</td></tr>'}</table></div>`;
}
window.emargementModal=function(){
  if(!['Administrateur','Direction','Surveillant Général','Surveillant secondaire','Enseignant'].includes(me.r)){toast('Accès non autorisé.');return}
  const teacherOptions=(db.teachers||[]).map(t=>`<option>${E(t.prenom+' '+t.nom)}</option>`).join('');
  form('Nouvel émargement',`<div class="grid">${F('Date','date',new Date().toISOString().slice(0,10),'date')}${F('Heure de cours','heure','08:00','time')}${F("Nombre d'heures",'nbHeures','1','number')}<div class="field"><label>Classe</label><select name="classe">${classes.map(c=>`<option>${E(c)}</option>`).join('')}</select></div><div class="field"><label>Enseignant</label><select name="enseignant">${teacherOptions}</select></div><div class="field"><label>Présence</label><select name="present"><option>Présent</option><option>Absent</option></select></div></div><button class="btn primary">Enregistrer</button>`,e=>{e.preventDefault();const o=Object.fromEntries(new FormData(e.target));o.id=Date.now();o.nbHeures=Number(o.nbHeures||0);db.emargement=db.emargement||[];db.emargement.push(o);save();close();show('emargement');toast('Émargement enregistré.')});
};
function classesPage(){return head("Classes","Préscolaire jusqu’à Terminale")+`<div class="cards">${classes.map((x,i)=>`<div class="card"><span class="tag">${i+1}</span><h3>${x}</h3><div class="sub">${db.students.filter(s=>s.classe===x).length} élève(s)</div></div>`).join("")}</div>`}
function schedule(){let m=["Administrateur","Direction","Surveillant Général","Surveillant secondaire"].includes(me.r);return head("Emploi du temps","Ajout et modification des horaires",m?`<button class="btn primary" onclick="scheduleModal()">+ Ajouter un cours</button>`:"")+`<div class="panel"><div class="toolbar"><select id="scl" onchange="scheduleRows()"><option value="">Toutes les classes</option>${classes.map(x=>`<option>${x}</option>`).join("")}</select></div><div id="stt">${scheduleRows(true)}</div></div>`}
function scheduleRows(init){let c=document.getElementById("scl")?.value||"",m=["Administrateur","Direction","Surveillant Général","Surveillant secondaire"].includes(me.r),r=db.schedule.filter(x=>!c||x.classe===c);let h=`<table><tr><th>Classe</th><th>Jour</th><th>Horaire</th><th>Matière</th><th>Enseignant</th><th>Salle</th><th></th></tr>${r.map(x=>`<tr><td>${x.classe}</td><td>${x.jour}</td><td>${x.debut}–${x.fin}</td><td>${esc(x.matiere)}</td><td>${esc(x.enseignant)}</td><td>${esc(x.salle)}</td><td>${m?`<button class="btn danger" onclick="del('schedule',${x.id})">Supprimer</button>`:""}</td></tr>`).join("")}</table>`;if(init)return h;document.getElementById("stt").innerHTML=h}
function abs(){return head("Absences & retards","Pointage des élèves",`<button class="btn primary" onclick="absModal()">+ Pointer</button>`)+`<div class="panel"><table><tr><th>Élève</th><th>Date</th><th>Type</th><th>Motif</th></tr>${db.abs.map(x=>`<tr><td>${esc(x.eleve)}</td><td>${x.date}</td><td>${x.type}</td><td>${esc(x.motif)}</td></tr>`).join("")}</table></div>`}
function discipline(){let m=["Administrateur","Direction","Surveillant Général","Surveillant secondaire"].includes(me.r);return head("Discipline","Incidents et dispositions",m?`<button class="btn primary" onclick="discModal()">+ Ajouter un incident</button>`:"")+`<div class="panel"><table><tr><th>Élève</th><th>Date</th><th>Incident</th><th>Disposition</th><th>Statut</th></tr>${db.disc.map(x=>`<tr><td>${esc(x.eleve)}</td><td>${x.date}</td><td>${esc(x.type)} — ${esc(x.desc)}</td><td>${esc(x.action)}</td><td>${x.status}</td></tr>`).join("")}</table></div>`}
function notes(){return head("Notes & bulletins","Saisie des résultats pédagogiques",`<button class="btn" onclick="cpoBulletinModal()">🎓 Bulletins</button> <button class="btn" onclick="noteClasse()">📋 Saisie par classe</button> <button class="btn primary" onclick="noteModal()">+ Saisir une note</button>`)+`<div class="panel"><table><tr><th>Élève</th><th>Matière</th><th>Note</th><th>Coefficient</th></tr>${db.notes.map(x=>`<tr><td>${esc(x.eleve)}</td><td>${esc(x.mat)}</td><td>${x.note}/20</td><td>${x.coef}</td></tr>`).join("")}</table></div>`}
function finance(){if(!ok("finances"))return "<div class=panel>Accès non autorisé.</div>";let total=db.pay.reduce((a,x)=>a+Number(x.montant||0),0);return head("Finances","Paiements, reçus et situation financière",`<button class="btn primary" onclick="payModal()">+ Enregistrer un paiement</button>`)+`<div class="cards"><div class="card">💰 Total encaissé<div class="metric">${total.toLocaleString("fr-FR")} F CFA</div></div><div class="card">🧾 Paiements<div class="metric">${db.pay.length}</div></div></div><div class="panel"><table><tr><th>Élève</th><th>Date</th><th>Montant</th><th>Motif</th></tr>${db.pay.map(x=>`<tr><td>${esc(x.eleve)}</td><td>${x.date}</td><td>${Number(x.montant).toLocaleString("fr-FR")} F CFA</td><td>${esc(x.motif)}</td></tr>`).join("")}</table></div>`}
function communication(){return head("Communication","Annonces de C.P.O. School",`<button class="btn primary" onclick="newsModal()">+ Nouvelle annonce</button>`)+`<div class="grid">${db.news.map(x=>`<div class=panel><h3>${esc(x.t)}</h3><p>${esc(x.m)}</p><small>${x.d}</small></div>`).join("")||"<div class=panel>Aucune annonce.</div>"}</div>`}
function documents(){return head("Documents","Documents scolaires et administratifs")+`<div class=cards><div class=card>📄 Bulletins scolaires</div><div class=card>📋 Listes d'élèves</div><div class=card>🧾 Reçus de paiement<br><small>Accès financier uniquement</small></div></div>`}
function usersPage(){if(!ok("utilisateurs"))return "<div class=panel>Accès réservé à l’Administrateur.</div>";return head("Utilisateurs & droits","Gestion des rôles")+`<div class=panel><table><tr><th>Rôle</th><th>Modules autorisés</th></tr>${Object.keys(perms).map(r=>`<tr><td><b>${r}</b></td><td>${perms[r].join(" · ")}</td></tr>`).join("")}</table></div>`}
function open(x){document.getElementById("mb").innerHTML=x;document.getElementById("modal").classList.add("show")}function close(){document.getElementById("modal").classList.remove("show")}document.getElementById("modal").onclick=e=>{if(e.target.id==="modal")close()}
function form(title,fields,fn){open(`<h3>${title}</h3><form id=fm>${fields}</form>`);document.getElementById("fm").onsubmit=fn}
const sel=()=>classes.map(x=>`<option>${x}</option>`).join("");const people=()=>db.students.map(s=>`<option data-id="${s.id}">${esc(s.nom)} ${esc(s.prenom)} — ${s.classe}</option>`).join("");
function studentModal(id){let s=db.students.find(x=>x.id===id)||{nom:"",prenom:"",classe:classes[0],tel:""};form(id?"Modifier un élève":"Ajouter un élève",`<div class=grid><div class=field><label>Nom</label><input name=nom value="${esc(s.nom)}" required></div><div class=field><label>Prénom</label><input name=prenom value="${esc(s.prenom)}" required></div><div class=field><label>Classe</label><select name=classe>${classes.map(x=>`<option ${x===s.classe?"selected":""}>${x}</option>`).join("")}</select></div><div class=field><label>Téléphone</label><input name=tel value="${esc(s.tel)}"></div></div><button class="btn primary">Enregistrer</button> <button type=button class="btn ghost" onclick="window.close()">Annuler</button>`,e=>{e.preventDefault();let o=Object.fromEntries(new FormData(e.target));if(id)Object.assign(db.students.find(x=>x.id===id),o);else db.students.push({id:Date.now(),...o});save();close();show("eleves");toast("Élève enregistré.")})}
function teacherModal(id){let t=db.teachers.find(x=>x.id===id)||{nom:"",prenom:"",matiere:"",tel:"",email:"",classes:"",etat:"Disponible"};form(id?"Modifier un enseignant":"Ajouter un enseignant",`<div class=grid><div class=field><label>Nom</label><input name=nom value="${esc(t.nom)}" required></div><div class=field><label>Prénom</label><input name=prenom value="${esc(t.prenom)}" required></div><div class=field><label>Matière</label><input name=matiere value="${esc(t.matiere)}" required></div><div class=field><label>Téléphone</label><input name=tel value="${esc(t.tel)}"></div><div class=field><label>E-mail</label><input name=email value="${esc(t.email)}"></div><div class=field><label>Classes</label><input name=classes value="${esc(t.classes)}"></div><div class=field><label>État / disponibilité</label><input name=etat value="${esc(t.etat)}"></div></div><button class="btn primary">Enregistrer</button>`,e=>{e.preventDefault();let o=Object.fromEntries(new FormData(e.target));if(id)Object.assign(db.teachers.find(x=>x.id===id),o);else db.teachers.push({id:Date.now(),...o});save();close();show("enseignants");toast("Enseignant enregistré.")})}
function scheduleModal(){form("Ajouter un cours",`<div class=grid><div class=field><label>Classe</label><select name=classe>${sel()}</select></div><div class=field><label>Jour</label><select name=jour><option>Lundi</option><option>Mardi</option><option>Mercredi</option><option>Jeudi</option><option>Vendredi</option><option>Samedi</option></select></div><div class=field><label>Début</label><input type=time name=debut value=08:00></div><div class=field><label>Fin</label><input type=time name=fin value=10:00></div><div class=field><label>Matière</label><input name=matiere required></div><div class=field><label>Enseignant</label><input name=enseignant required></div><div class=field><label>Salle</label><input name=salle></div></div><button class="btn primary">Ajouter</button>`,e=>{e.preventDefault();db.schedule.push({id:Date.now(),...Object.fromEntries(new FormData(e.target))});save();close();show("emploi");toast("Cours ajouté.")})}
function absModal(){form("Pointer une absence / un retard",`<div class=field><label>Élève</label><select name=eleve>${people()}</select></div><div class=grid><div class=field><label>Date</label><input type=date name=date value="${new Date().toISOString().slice(0,10)}"></div><div class=field><label>Type</label><select name=type><option>Absence</option><option>Retard</option></select></div></div><div class=field><label>Motif</label><input name=motif></div><button class="btn primary">Enregistrer</button>`,e=>{e.preventDefault();db.abs.push({id:Date.now(),...Object.fromEntries(new FormData(e.target))});save();close();show("absences");toast("Pointage enregistré.")})}
function discModal(){form("Ajouter un incident disciplinaire",`<div class=field><label>Élève</label><select name=eleve>${people()}</select></div><div class=grid><div class=field><label>Date</label><input type=date name=date value="${new Date().toISOString().slice(0,10)}"></div><div class=field><label>Type</label><input name=type required></div></div><div class=field><label>Description</label><textarea name=desc></textarea></div><div class=field><label>Disposition prise</label><input name=action></div><div class=field><label>Statut</label><select name=status><option>En suivi</option><option>Clôturé</option></select></div><button class="btn primary">Enregistrer</button>`,e=>{e.preventDefault();db.disc.push({id:Date.now(),...Object.fromEntries(new FormData(e.target))});save();close();show("discipline");toast("Incident enregistré.")})}
function noteModal(){form("Saisir une note",`<div class=grid><div class=field><label>Élève</label><select name=eleve>${people()}</select></div><div class=field><label>Matière</label><input name=mat required></div><div class=field><label>Note /20</label><input type=number name=note min=0 max=20 step=.25 required></div><div class=field><label>Coefficient</label><input type=number name=coef value=1 min=1></div></div><button class="btn primary">Enregistrer</button>`,e=>{e.preventDefault();db.notes.push({id:Date.now(),...Object.fromEntries(new FormData(e.target))});save();close();show("notes");toast("Note enregistrée.")})}
function payModal(){if(!ok("finances"))return;form("Enregistrer un paiement",`<div class=field><label>Élève</label><select name=eleve>${people()}</select></div><div class=grid><div class=field><label>Date</label><input type=date name=date value="${new Date().toISOString().slice(0,10)}"></div><div class=field><label>Montant FCFA</label><input type=number name=montant min=0 required></div></div><div class=field><label>Motif</label><input name=motif required></div><button class="btn primary">Enregistrer le paiement</button>`,e=>{e.preventDefault();db.pay.push({id:Date.now(),...Object.fromEntries(new FormData(e.target))});save();close();show("finances");toast("Paiement enregistré.")})}
function newsModal(){form("Nouvelle annonce",`<div class=field><label>Titre</label><input name=t required></div><div class=field><label>Message</label><textarea name=m required></textarea></div><button class="btn primary">Publier</button>`,e=>{e.preventDefault();let o=Object.fromEntries(new FormData(e.target));db.news.unshift({...o,d:new Date().toLocaleDateString("fr-FR")});save();close();show("communication");toast("Annonce publiée.")})}
function del(c,id){if(!["Administrateur","Direction","Surveillant Général","Surveillant secondaire"].includes(me.r)){toast("Suppression non autorisée.");return}if(!confirm("Confirmer la suppression ?"))return;db[c]=db[c].filter(x=>x.id!==id);save();show(page);toast("Élément supprimé.")}
</script>

<style id="cpo-pdf-features">

  .no-print{display:none!important}
}
#cpoPrintArea{display:none}.cpo-doc-actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.cpo-doc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.cpo-doc-card{border:1px solid var(--line,#e5d5c2);border-radius:16px;padding:18px;background:#fff;box-shadow:0 8px 24px #00000008;cursor:pointer;text-align:left}
.cpo-doc-card:hover{transform:translateY(-2px);box-shadow:0 12px 28px #00000012}
.cpo-doc-card .ico{font-size:28px;display:block;margin-bottom:8px}.cpo-doc-card b{display:block;font-size:16px}.cpo-doc-card small{color:var(--mut,#786b64)}
.cpo-receipt{max-width:760px;margin:auto;border:1px solid #bbb;padding:30px;background:#fff}.cpo-receipt h1{text-align:center;margin:0 0 4px}.cpo-receipt .school{text-align:center;font-weight:700}.cpo-receipt .receipt-no{text-align:right;margin:18px 0;font-weight:700}.cpo-receipt table{width:100%;border-collapse:collapse}.cpo-receipt td,.cpo-receipt th{border:1px solid #aaa;padding:10px;text-align:left}.cpo-total{font-size:18px;font-weight:700;text-align:right;margin-top:18px}.cpo-sign{display:flex;justify-content:space-between;margin-top:55px}.cpo-report-title{text-align:center;margin-bottom:20px}.cpo-report-title h1{margin:0}.cpo-report-title p{margin:5px;color:#555}
</style>

<script id="cpo-pdf-features-js">
(function(){
  const financeRoles=["Administrateur","Direction","Comptabilité","Finance"];
  function canFinance(){return typeof me!=="undefined" && !!me && financeRoles.includes(me.r)}
  function money(v){return Number(v||0).toLocaleString("fr-FR")+" F CFA"}
  function today(){return new Date().toLocaleDateString("fr-FR")}
  function safe(v){return typeof esc==='function'?esc(v):String(v??'')}
  function printDoc(title,html){
    let area=document.getElementById('cpoPrintArea');
    if(!area){area=document.createElement('div');area.id='cpoPrintArea';document.body.appendChild(area)}
    area.innerHTML=html+`<div class="no-print" style="text-align:center;margin-top:24px"><button class="btn primary" onclick="window.print()">🖨️ Imprimer / Enregistrer en PDF</button></div>`;
    document.title=title+' — C.P.O. School';
    area.style.display='block';
    setTimeout(()=>window.print(),80);
  }
  function closePrintArea(){let a=document.getElementById('cpoPrintArea');if(a)a.style.display='none'}
  window.addEventListener('afterprint',closePrintArea);
  window.cpoPrint=printDoc;
  window.cpoReceipt=function(id){
    if(!canFinance()){toast('Accès réservé à l’Administration, la Direction et la Finance.');return}
    const p=db.pay.find(x=>String(x.id)===String(id)); if(!p)return;
    const no=p.receiptNo||('REC-'+String(p.id).slice(-8));
    const html=`<div class="cpo-receipt"><div class="school">C.P.O. SCHOOL</div><h1>REÇU DE PAIEMENT</h1><div class="receipt-no">N° ${safe(no)}</div><table><tr><th>Élève</th><td>${safe(p.eleve)}</td></tr><tr><th>Date</th><td>${safe(p.date||today())}</td></tr><tr><th>Motif</th><td>${safe(p.motif)}</td></tr><tr><th>Montant</th><td><b>${money(p.montant)}</b></td></tr><tr><th>Enregistré par</th><td>${safe(me?.r||'Administration')}</td></tr></table><div class="cpo-total">Montant reçu : ${money(p.montant)}</div><div class="cpo-sign"><span>Signature de l’établissement</span><span>Signature / Cachet</span></div></div>`;
    cpoPrint('Reçu '+no,html);
  };
  window.cpoPrintStudents=function(){
    const rows=db.students.map((s,i)=>`<tr><td>${i+1}</td><td>${safe(s.nom)} ${safe(s.prenom)}</td><td>${safe(s.classe)}</td><td>${safe(s.tel||'')}</td></tr>`).join('');
    cpoPrint('Liste des élèves',`<div class="cpo-report-title"><h1>C.P.O. SCHOOL</h1><h2>LISTE DES ÉLÈVES</h2><p>Édité le ${today()}</p></div><table border="1" cellspacing="0" cellpadding="8" style="width:100%;border-collapse:collapse"><tr><th>#</th><th>Élève</th><th>Classe</th><th>Téléphone</th></tr>${rows||'<tr><td colspan="4">Aucun élève</td></tr>'}</table>`)
  };
  window.cpoPrintTeachers=function(){
    const rows=db.teachers.map((t,i)=>`<tr><td>${i+1}</td><td>${safe(t.nom)} ${safe(t.prenom)}</td><td>${safe(t.matiere)}</td><td>${safe(t.classes)}</td><td>${safe(t.tel||'')}</td></tr>`).join('');
    cpoPrint('Liste des enseignants',`<div class="cpo-report-title"><h1>C.P.O. SCHOOL</h1><h2>LISTE DES ENSEIGNANTS</h2><p>Édité le ${today()}</p></div><table border="1" cellspacing="0" cellpadding="8" style="width:100%;border-collapse:collapse"><tr><th>#</th><th>Enseignant</th><th>Matière</th><th>Classes</th><th>Téléphone</th></tr>${rows||'<tr><td colspan="5">Aucun enseignant</td></tr>'}</table>`)
  };
  window.cpoPrintPayments=function(){
    if(!canFinance()){toast('Accès réservé à l’Administration, la Direction et la Finance.');return}
    const rows=db.pay.map((p,i)=>`<tr><td>${i+1}</td><td>${safe(p.receiptNo||('REC-'+String(p.id).slice(-8)))}</td><td>${safe(p.eleve)}</td><td>${safe(p.date)}</td><td>${safe(p.motif)}</td><td>${money(p.montant)}</td></tr>`).join('');
    const total=db.pay.reduce((a,p)=>a+Number(p.montant||0),0);
    cpoPrint('Journal des paiements',`<div class="cpo-report-title"><h1>C.P.O. SCHOOL</h1><h2>JOURNAL DES PAIEMENTS</h2><p>Édité le ${today()}</p></div><table border="1" cellspacing="0" cellpadding="8" style="width:100%;border-collapse:collapse"><tr><th>#</th><th>N° reçu</th><th>Élève</th><th>Date</th><th>Motif</th><th>Montant</th></tr>${rows||'<tr><td colspan="6">Aucun paiement</td></tr>'}</table><p style="text-align:right;font-weight:bold;margin-top:18px">TOTAL : ${money(total)}</p>`)
  };
  window.cpoPrintDiscipline=function(){

    const totalCoef=notes.reduce((a,n)=>a+Number(n.coef||1),0); const totalPts=notes.reduce((a,n)=>a+Number(n.note||0)*Number(n.coef||1),0); const avg=totalCoef?totalPts/totalCoef:0;

  };
  // Replace finance page with receipt buttons.
  window.finance=function(){if(!ok('finances'))return '<div class="panel">Accès non autorisé.</div>';let total=db.pay.reduce((a,x)=>a+Number(x.montant||0),0);return head('Finances','Paiements, reçus et situation financière',`<button class="btn" onclick="cpoPrintPayments()">📄 Journal PDF</button> <button class="btn primary" onclick="payModal()">+ Enregistrer un paiement</button>`)+`<div class="cards"><div class="card">💰 Total encaissé<div class="metric">${total.toLocaleString('fr-FR')} F CFA</div></div><div class="card">🧾 Paiements<div class="metric">${db.pay.length}</div></div></div><div class="panel"><table><tr><th>N° reçu</th><th>Élève</th><th>Date</th><th>Montant</th><th>Motif</th><th>Document</th></tr>${db.pay.map(x=>`<tr><td>${safe(x.receiptNo||('REC-'+String(x.id).slice(-8)))}</td><td>${safe(x.eleve)}</td><td>${safe(x.date)}</td><td>${money(x.montant)}</td><td>${safe(x.motif)}</td><td><button class="btn" onclick="cpoReceipt(${x.id})">🧾 Reçu PDF</button></td></tr>`).join('')||'<tr><td colspan="6">Aucun paiement enregistré.</td></tr>'}</table></div>`}
  window.documents=window.cpoDocumentsEnhanced;

<script id="cpo-final-finance-and-school-ui">
(function(){
  const financeRoles=["Administrateur","Direction","Comptabilité","Finance"];
  function canFinanceFinal(){return typeof me!=="undefined" && !!me && financeRoles.includes(me.r)}
  function safeFinal(v){return typeof esc==='function'?esc(v):String(v??'')}
  function moneyFinal(v){return Number(v||0).toLocaleString('fr-FR')+' F CFA'}

  /* Réutilise le visuel déjà intégré au fichier, sans ajouter de fichier externe. */
  function applySchoolVisual(){
    const logo=document.querySelector('.topbrand img') || document.querySelector('.loginbox .brand img');
    if(logo && logo.src) document.documentElement.style.setProperty('--cpo-school-image','url("'+logo.src+'")');
    if(document.querySelector('.top') && !document.querySelector('.cpo-school-banner')){
      const b=document.createElement('div');
      b.className='cpo-school-banner';
      b.innerHTML=(logo?'<img src="'+logo.src+'" alt="C.P.O. School">':'')+'<div><strong>C.P.O. SCHOOL</strong><span>Gestion scolaire · Administration · Pédagogie · Finance</span></div>';
      const main=document.getElementById('main');
      if(main) main.prepend(b);
    }
  }

  window.financeEdit=function(id){
    if(!canFinanceFinal()){toast('Accès non autorisé.');return}
    const p=db.pay.find(x=>String(x.id)===String(id)); if(!p)return;
    form('Modifier le paiement',`<div class="field"><label>Élève</label><select name="eleve">${people()}</select></div><div class="grid"><div class="field"><label>Date</label><input type=date name=date value="${safeFinal(p.date||'')}"></div><div class="field"><label>Montant FCFA</label><input type=number name=montant min=0 required value="${Number(p.montant||0)}"></div></div><div class="field"><label>Motif</label><input name=motif required value="${safeFinal(p.motif||'')}"></div><button class="btn primary">Enregistrer les modifications</button> <button type="button" class="btn ghost" onclick="window.close()">Annuler</button>`,e=>{
      e.preventDefault();
      const o=Object.fromEntries(new FormData(e.target));
      Object.assign(p,o);
      save(); close(); show('finances'); toast('Paiement modifié.');
    });
    const sel=document.querySelector('#fm select[name="eleve"]');
    if(sel){ for(const opt of sel.options){ if(opt.value===p.eleve){sel.value=p.eleve;break;} } }
  };

  window.financeDelete=function(id){
    if(!canFinanceFinal()){toast('Suppression non autorisée.');return}
    const p=db.pay.find(x=>String(x.id)===String(id)); if(!p)return;
    if(!confirm('Supprimer définitivement ce paiement ?\n\n'+(p.eleve||'Élève')+' — '+moneyFinal(p.montant)))return;
    db.pay=db.pay.filter(x=>String(x.id)!==String(id));
    save(); show('finances'); toast('Paiement supprimé.');
  };

  window.finance=function(){
    if(!ok('finances'))return '<div class="panel">Accès non autorisé.</div>';
    const total=db.pay.reduce((a,x)=>a+Number(x.montant||0),0);
    return head('Finances','Paiements, reçus et situation financière',`<button class="btn" onclick="cpoPrintPayments()">📄 Journal PDF</button> <button class="btn primary" onclick="payModal()">+ Enregistrer un paiement</button>`)+
      `<div class="cards"><div class="card">💰 Total encaissé<div class="metric">${total.toLocaleString('fr-FR')} F CFA</div></div><div class="card">🧾 Paiements<div class="metric">${db.pay.length}</div></div></div>`+
      `<div class="panel"><table><tr><th>N° reçu</th><th>Élève</th><th>Date</th><th>Montant</th><th>Motif</th><th>Document</th><th>Actions</th></tr>`+
      (db.pay.map(x=>`<tr><td>${safeFinal(x.receiptNo||('REC-'+String(x.id).slice(-8)))}</td><td>${safeFinal(x.eleve)}</td><td>${safeFinal(x.date)}</td><td>${moneyFinal(x.montant)}</td><td>${safeFinal(x.motif)}</td><td><button class="btn" onclick="cpoReceipt(${x.id})">🧾 Reçu PDF</button></td><td><div class="cpo-fin-actions"><button class="btn ghost cpo-fin-edit" onclick="financeEdit(${x.id})">✏️ Modifier</button><button class="btn ghost cpo-fin-delete" onclick="financeDelete(${x.id})">🗑️ Annuler</button></div></td></tr>`).join('')||'<tr><td colspan="7">Aucun paiement enregistré.</td></tr>')+
      `</table></div>`;
  };

  /* Laisse le reste du projet inchangé et applique seulement l'habillage après rendu. */
  const oldShow=window.show;
  window.show=function(x){ oldShow(x); applySchoolVisual(); };
  window.addEventListener('load',applySchoolVisual);
  setTimeout(applySchoolVisual,300);
})();
</script>
<script id="cpo-v2">
function cpoIndicator(s){let el=document.getElementById('cpo-sync-indicator');if(!el){el=document.createElement('div');el.id='cpo-sync-indicator';el.style.cssText='position:fixed;left:18px;bottom:18px;z-index:99;padding:8px 12px;border-radius:12px;background:#fff;border:1px solid #ddd;box-shadow:0 5px 22px #0002;font:600 12px Segoe UI,Arial';document.body.appendChild(el)}
const lb=localStorage.getItem('cpo_last_backup');el.textContent=s==='syncing'?'🟠 Synchronisation…':s==='synced'?'🟢 Synchronisé avec le serveur':s==='conflict'?'🔴 Conflit : données du serveur rechargées':'💾 Enregistré sur cet appareil seulement'+(lb?' · sauvegarde du '+new Date(+lb).toLocaleDateString('fr-FR'):' · aucune sauvegarde')}
(function(){
const money=v=>Number(v||0).toLocaleString('fr-FR')+' F CFA',E=v=>esc(v),adm=()=>['Administrateur','Direction'].includes(me.r);
const mine=(r,s)=>r.eleveId?String(r.eleveId)===String(s.id):String(r.eleve).startsWith(s.nom+' '+s.prenom+' —');
const feeOf=s=>Number((db.fees||{})[s.classe]||0),paidBy=s=>db.pay.filter(p=>mine(p,s)).reduce((a,p)=>a+Number(p.montant||0),0);
// formulaires : mémorise l'identifiant de l'élève
const _form=window.form;
window.form=function(t,f,fn){_form(t,f,fn);const fm=document.getElementById('fm'),s=fm&&fm.querySelector('select[name=eleve]');if(!s)return;
const h=document.createElement('input');h.type='hidden';h.name='eleveId';fm.appendChild(h);const o=fm.onsubmit;fm.onsubmit=e=>{h.value=s.selectedOptions[0]?.dataset.id||'';return o(e)}};
// sauvegarde
window.cpoBackup=function(){if(!adm()){toast('Réservé à la Direction.');return}const payload={_cpoBackupVersion:2,_exportedAt:new Date().toISOString(),_sourceUser:me&&me.id||'',data:db};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));a.download='CPO_sauvegarde_'+new Date().toISOString().slice(0,10)+'_'+new Date().toTimeString().slice(0,5).replace(':','')+'.json';a.click();localStorage.setItem('cpo_last_backup',Date.now());cpoIndicator(JSON.parse(localStorage.getItem('cpo_cloud_meta_v1')||'{}').status||'offline');toast('Sauvegarde JSON téléchargée.');};
function cloneCPO(x){return JSON.parse(JSON.stringify(x));}
function backupNormalize(raw){return raw&&raw.data&&typeof raw.data==='object'?raw.data:raw;}
function mergeCPOData(incoming){
  const current=cloneCPO(db), inc=backupNormalize(incoming), conflicts=[];
  if(!inc||!Array.isArray(inc.students)||!Array.isArray(inc.pay))throw new Error('invalid');
  const arrayKeys=['students','teachers','schedule','abs','disc','notes','pay','news','cal','emargement','teacherSalaries'];
  const keyFields={students:['id'],teachers:['id'],schedule:['id'],abs:['id'],disc:['id'],notes:['id'],pay:['id'],news:['id'],cal:['id']};
  for(const k of arrayKeys){
    if(!Array.isArray(inc[k]))continue;
    if(!Array.isArray(current[k]))current[k]=[];
    const by=new Map(current[k].map(x=>[String(x.id??''),x]));
    for(const item of inc[k]){
      const id=String(item.id??'');
      if(id && by.has(id)){
        const old=by.get(id), ni=JSON.stringify(item), no=JSON.stringify(old);
        if(ni!==no)conflicts.push({k,id,old:cloneCPO(old),incoming:cloneCPO(item)});
      }else current[k].push(cloneCPO(item));
    }
  }
  // Merge object-style settings without deleting fields from the current PC.
  for(const k of ['fees','cfg','exp','payCancel','archive']){
    if(inc[k]===undefined)continue;
    if(inc[k]&&typeof inc[k]==='object'&&!Array.isArray(inc[k]))current[k]={...(current[k]||{}),...cloneCPO(inc[k])};
    else if(current[k]===undefined)current[k]=cloneCPO(inc[k]);
  }
  if(Array.isArray(inc.users)){
    current.users=current.users||[];const um=new Map(current.users.map(x=>[String(x.id),x]));
    inc.users.forEach(u=>{if(!um.has(String(u.id)))current.users.push(cloneCPO(u));});
  }
  return {current,conflicts};
}
function applyConflicts(current,conflicts,mode){for(const c of conflicts){const arr=current[c.k];if(!Array.isArray(arr))continue;const idx=arr.findIndex(x=>String(x.id)===String(c.id));if(idx<0)continue;if(mode==='incoming')arr[idx]=c.incoming;}}
window.cpoRestore=function(){if(!adm()){toast('Réservé à la Direction.');return}const i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=()=>{const file=i.files&&i.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{
  const raw=JSON.parse(r.result),{current,conflicts}=mergeCPOData(raw);
  // Automatic rollback point before any merge.
  const safety={_cpoBackupVersion:2,_safety:true,_createdAt:new Date().toISOString(),data:db};
  localStorage.setItem('cpo_premerge_backup',JSON.stringify(safety));
  if(conflicts.length){
    const incoming=confirm('Fusion terminée avec '+conflicts.length+' conflit(s).\n\nOK = privilégier les données du fichier importé.\nAnnuler = conserver les données de ce PC.\n\nUne sauvegarde de sécurité du PC actuel vient d’être créée.');
    applyConflicts(current,conflicts,incoming?'incoming':'current');
  }
  db=current;save();show(page);toast('Fusion terminée : les données du PC ont été conservées.');
}catch(e){toast('Fichier JSON invalide ou incompatible.');}};r.readAsText(file)};i.click()};
window.cpoUndoMerge=function(){const raw=localStorage.getItem('cpo_premerge_backup');if(!raw){toast('Aucune sauvegarde de sécurité disponible.');return}if(!confirm('Restaurer la base juste avant la dernière fusion ?'))return;try{const x=JSON.parse(raw);db=x.data;save();show(page);localStorage.removeItem('cpo_premerge_backup');toast('Version précédente restaurée.')}catch(e){toast('Sauvegarde de sécurité invalide.')}};
// bulletin (notes liées par id) avec rang
const avgOf=s=>{const ns=db.notes.filter(n=>mine(n,s)),c=ns.reduce((a,n)=>a+Number(n.coef||1),0);return c?ns.reduce((a,n)=>a+Number(n.note)*Number(n.coef||1),0)/c:null};

let tm;const rs=()=>{clearTimeout(tm);tm=setTimeout(()=>{if(me){logout()}},15*60*1000)};['click','keydown','mousemove','touchstart'].forEach(v=>document.addEventListener(v,rs,{passive:true}));
const l0=window.login;window.login=function(){l0();rs();const lb=+localStorage.getItem('cpo_last_backup')||0;if(Date.now()-lb>7*864e5)setTimeout(()=>toast('Pensez à faire une sauvegarde (⬇ Sauvegarde).'),1500)};
})();
</script>
<script id="cpo-online">
(function(){
const K=['students','teachers','schedule','abs','disc','notes','pay','news','fees','cls','users','cfg','log','exp','cal','payCancel','archive','emargement','teacherSalaries'],P={};let D=null,t=null;
const J=k=>JSON.stringify(db[k]),st=s=>{try{cpoIndicator(s)}catch(e){}};
async function push(){t=null;if(!D)return false;st('syncing');try{for(const k of K){if(db[k]===undefined)continue;const j=J(k);if(P[k]!==j){await D.doc('app/'+k).set({json:j});P[k]=j}}st('synced');return true}catch(e){st('offline');toast('Erreur de synchronisation : '+(e.code||'réseau'));return false}}
async function pullAll(){let ch=0;for(const k of K){try{const s=await D.doc('app/'+k).get();if(s.exists()){const v=s.data().json;if(v!==J(k)){db[k]=JSON.parse(v);P[k]=v;ch++}}}catch(e){}}if(ch){localStorage.setItem('cpo_db',JSON.stringify(db));if(typeof me!=='undefined'&&me)show(page)}return ch}
async function fullSync(){if(!D){st('offline');toast('Synchronisation impossible : hors ligne ou non connecté.');return}clearTimeout(t);const ok1=await push();if(!ok1)return;st('syncing');const n=await pullAll();st('synced');toast('Synchronisation terminée'+(n?' : '+n+' module(s) mis à jour.':', tout est à jour.'))}
window.CPOCloudSync={markChanged(){if(!D){st('offline');return}clearTimeout(t);t=setTimeout(push,600)},sync:fullSync,pull:pullAll,push};
async function init(){if(!window.claude||!claude.use){st('offline');return}
try{D=await claude.use('db')}catch(e){D=null}if(!D){st('offline');return}
for(const k of K){const r=D.doc('app/'+k);let s=null;try{s=await r.get()}catch(e){}
 if(s&&s.exists()){try{db[k]=JSON.parse(s.data().json);P[k]=J(k)}catch(e){}}else if(db[k]!==undefined){try{await r.set({json:J(k)});P[k]=J(k)}catch(e){}}
 r.onSnapshot(sn=>{if(t||!sn.exists())return;try{const v=sn.data().json;if(v===P[k]||v===J(k))return;db[k]=JSON.parse(v);P[k]=v;localStorage.setItem('cpo_db',JSON.stringify(db));
  const a=document.activeElement;if(typeof me!=='undefined'&&me&&!document.querySelector('.modal.show')&&!(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)))show(page)}catch(e){}},()=>{})}
st('synced')}
// téléchargements via la capacité "downloads"
const c0=HTMLAnchorElement.prototype.click;
HTMLAnchorElement.prototype.click=function(){if(this.download&&String(this.href).startsWith('blob:')){try{return c0.call(this)}catch(e){}}return c0.call(this)};
window.addEventListener('load',()=>setTimeout(init,300));
})();
</script>

<script id="cpo-v6">
(function(){
  const E=v=>esc(v), money=v=>Number(v||0).toLocaleString('fr-FR')+' F CFA';
  // --- ÉMARGEMENT : formulaire robuste + boutons Présent/Absent directement dans le tableau ---
  window.emargementModal=function(){
    if(!['Administrateur','Direction','Surveillant Général','Surveillant secondaire','Enseignant'].includes(me.r)){toast('Accès non autorisé.');return}
    const today=new Date().toISOString().slice(0,10);
    const teacherOptions=(db.teachers||[]).map(t=>`<option value="${E(t.prenom+' '+t.nom)}">${E(t.prenom+' '+t.nom)}</option>`).join('')||'<option value="">Aucun enseignant enregistré</option>';
    open(`<h3>Nouvel émargement</h3><form id="fm"><div class="grid">
      <div class="field"><label>Date</label><input type="date" name="date" value="${today}" required></div>
      <div class="field"><label>Heure de cours</label><input type="time" name="heure" value="08:00" required></div>
      <div class="field"><label>Nombre d'heures</label><input type="number" name="nbHeures" value="1" min="0.5" step="0.5" required></div>
      <div class="field"><label>Classe</label><select name="classe">${classes.map(c=>`<option>${E(c)}</option>`).join('')}</select></div>
      <div class="field"><label>Enseignant</label><select name="enseignant">${teacherOptions}</select></div>
      <div class="field"><label>Présence</label><select name="present"><option value="Présent">Présent</option><option value="Absent">Absent</option></select></div>
    </div><button type="submit" class="btn primary">✅ Enregistrer l’émargement</button></form>`);
    const fm=document.getElementById('fm');
    fm.onsubmit=function(e){
      e.preventDefault();
      const o=Object.fromEntries(new FormData(fm));
      o.id=Date.now(); o.nbHeures=Number(o.nbHeures||0); o.createdAt=new Date().toISOString();
      db.emargement=db.emargement||[]; db.emargement.push(o); save(); close(); show('emargement'); toast('Émargement enregistré.');
    };
  };

  window.setEmargementPresence=function(id,status){
    if(!['Administrateur','Direction','Surveillant Général','Surveillant secondaire','Enseignant'].includes(me.r)){toast('Modification non autorisée.');return}
    const x=(db.emargement||[]).find(r=>String(r.id)===String(id)); if(!x)return;
    x.present=status; save(); show('emargement'); toast(status==='Présent'?'Présence enregistrée.':'Absence enregistrée.');
  };

  const oldEmargement=window.emargement;
  window.emargement=function(){
    const html=oldEmargement();
    // Remplace le tableau généré par la version interactive tout en conservant l'en-tête et le bouton.
    const rows=(db.emargement||[]).slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.heure||'').localeCompare(a.heure||''));
    const canEdit=['Administrateur','Direction','Surveillant Général','Surveillant secondaire','Enseignant'].includes(me.r);
    const table=`<div class="panel"><div class="toolbar"><span class="tag">${rows.length} émargement(s)</span><span class="sub">Cliquez sur Présent ou Absent pour modifier le pointage.</span></div><div style="overflow-x:auto"><table><tr><th>Date</th><th>Heure</th><th>Heures</th><th>Classe</th><th>Enseignant</th><th>Présence</th><th>Actions</th></tr>${rows.map(x=>`<tr>
      <td>${E(x.date)}</td><td>${E(x.heure)}</td><td>${E(x.nbHeures)}</td><td>${E(x.classe)}</td><td>${E(x.enseignant)}</td>
      <td style="white-space:nowrap">${canEdit?`<button class="btn ${x.present==='Présent'?'primary':''}" onclick="setEmargementPresence(${x.id},'Présent')">☑ Présent</button> <button class="btn ${x.present==='Absent'?'danger':''}" onclick="setEmargementPresence(${x.id},'Absent')">☐ Absent</button>`:(x.present==='Présent'?'🟢 Présent':'🔴 Absent')}</td>
      <td>${canEdit?`<button class="btn danger" onclick="del('emargement',${x.id})">🗑️ Supprimer</button>`:'—'}</td>
    </tr>`).join('')||'<tr><td colspan="7">Aucun émargement enregistré.</td></tr>'}</table></div></div>`;
    return html.replace(/<div class="panel">[\s\S]*?<\/div>\s*$/,table);
  };

  // --- SALAIRES DES ENSEIGNANTS : module intégré aux Finances ---
  db.teacherSalaries=db.teacherSalaries||[];
  const salaryMonths=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
  const salaryCanEdit=()=>['Administrateur','Direction','Comptabilité'].includes(me.r);
  const teacherName=id=>{const t=(db.teachers||[]).find(x=>String(x.id)===String(id));return t?t.prenom+' '+t.nom:''};

  window.teacherSalaryModal=function(id){
    if(!salaryCanEdit()){toast('Accès non autorisé.');return}
    const old=(db.teacherSalaries||[]).find(x=>String(x.id)===String(id));
    const teachers=(db.teachers||[]);
    if(!teachers.length){toast('Ajoutez d’abord un enseignant.');return}
    const tOpts=teachers.map(t=>`<option value="${t.id}" ${old&&String(old.teacherId)===String(t.id)?'selected':''}>${E(t.prenom+' '+t.nom)}</option>`).join('');
    const now=new Date(), month=old?.mois||salaryMonths[now.getMonth()];
    open(`<h3>${old?'Modifier le salaire':'Nouveau salaire enseignant'}</h3><form id="fm"><div class="grid">
      <div class="field"><label>Enseignant</label><select name="teacherId" required>${tOpts}</select></div>
      <div class="field"><label>Mois</label><select name="mois">${salaryMonths.map(m=>`<option ${m===month?'selected':''}>${m}</option>`).join('')}</select></div>
      <div class="field"><label>Salaire mensuel (FCFA)</label><input type="number" name="montant" min="0" value="${old?Number(old.montant||0):0}" required></div>
      <div class="field"><label>Reliquat antérieur (FCFA)</label><input type="number" name="reliquat" min="0" value="${old?Number(old.reliquat||0):0}" placeholder="Montant restant des mois précédents"></div>
      <div class="field"><label>Statut</label><select name="statut"><option ${old?.statut!=='Payé'?'selected':''}>À payer</option><option ${old?.statut==='Payé'?'selected':''}>Payé</option></select></div>
      <div class="field"><label>Date de paiement</label><input type="date" name="datePaiement" value="${old?.datePaiement||''}"></div>
    </div><button type="submit" class="btn primary">💾 Enregistrer</button></form>`);
    document.getElementById('fm').onsubmit=function(e){
      e.preventDefault(); const o=Object.fromEntries(new FormData(e.target)); o.teacherId=String(o.teacherId); o.montant=Number(o.montant||0); o.reliquat=Number(o.reliquat||0); o.totalDu=o.montant+o.reliquat; o.id=old?old.id:Date.now();
      if(o.statut==='Payé'&&!o.datePaiement)o.datePaiement=new Date().toISOString().slice(0,10);
      if(old){const i=db.teacherSalaries.findIndex(x=>String(x.id)===String(old.id));db.teacherSalaries[i]=o}else db.teacherSalaries.push(o);
      save();close();show('finances');toast('Salaire enseignant enregistré.');
    };
  };

  window.toggleTeacherSalary=function(id){
    if(!salaryCanEdit()){toast('Modification non autorisée.');return}
    const x=db.teacherSalaries.find(r=>String(r.id)===String(id)); if(!x)return;
    x.statut=x.statut==='Payé'?'À payer':'Payé'; x.datePaiement=x.statut==='Payé'?new Date().toISOString().slice(0,10):'';
    save();show('finances');toast(x.statut==='Payé'?'Salaire marqué comme payé.':'Salaire remis à payer.');
  };

  window.teacherSalaryDelete=function(id){
    if(!salaryCanEdit()||!confirm('Supprimer cette ligne de salaire ?'))return;
    db.teacherSalaries=db.teacherSalaries.filter(x=>String(x.id)!==String(id));save();show('finances');toast('Ligne de salaire supprimée.');
  };

  const oldFinance=window.finance;
  window.finance=function(){
    const base=oldFinance(); if(!ok('finances'))return base;
    const rows=(db.teacherSalaries||[]).slice().sort((a,b)=>(salaryMonths.indexOf(b.mois)-salaryMonths.indexOf(a.mois)));
    const totalSal=rows.reduce((a,x)=>a+Number(x.montant||0),0), totalReliquat=rows.reduce((a,x)=>a+Number(x.reliquat||0),0), totalDu=rows.reduce((a,x)=>a+Number(x.totalDu??(Number(x.montant||0)+Number(x.reliquat||0)),0),0), totalPay=rows.filter(x=>x.statut==='Payé').reduce((a,x)=>a+Number(x.totalDu??(Number(x.montant||0)+Number(x.reliquat||0)),0),0), reste=totalDu-totalPay;
    const actions=salaryCanEdit()?`<button class="btn primary" onclick="teacherSalaryModal()">+ Nouveau salaire</button>`:'';
    return base+`<div class="panel"><div class="head"><div><h3>👨‍🏫 Salaires des enseignants</h3><div class="sub">Suivi mensuel des salaires, paiements et montants restant à payer.</div></div><div>${actions}</div></div>
      <div class="cards"><div class="card">💼 Total salaires<div class="metric">${money(totalSal)}</div></div><div class="card">↩️ Total reliquats<div class="metric">${money(totalReliquat)}</div></div><div class="card">🧾 Total dû<div class="metric">${money(totalDu)}</div></div><div class="card">⏳ Reste à payer<div class="metric">${money(reste)}</div></div></div>
      <div style="overflow-x:auto"><table><tr><th>Enseignant</th><th>Mois</th><th>Salaire</th><th>Reliquat</th><th>Total dû</th><th>Statut</th><th>Date paiement</th><th>Actions</th></tr>${rows.map(x=>`<tr><td><b>${E(teacherName(x.teacherId)||x.enseignant||'—')}</b></td><td>${E(x.mois||'—')}</td><td>${money(x.montant)}</td><td>${money(x.reliquat||0)}</td><td><b>${money(x.totalDu??(Number(x.montant||0)+Number(x.reliquat||0)))}</b></td><td>${x.statut==='Payé'?'<span class="tag">🟢 Payé</span>':'<span class="tag">🟠 À payer</span>'}</td><td>${E(x.datePaiement||'—')}</td><td style="white-space:nowrap">${salaryCanEdit()?`<button class="btn" onclick="toggleTeacherSalary(${x.id})">${x.statut==='Payé'?'↩ À payer':'☑ Marquer payé'}</button> <button class="btn" onclick="teacherSalaryModal(${x.id})">✏️ Modifier</button> <button class="btn danger" onclick="teacherSalaryDelete(${x.id})">🗑️</button>`:'—'}</td></tr>`).join('')||'<tr><td colspan="8">Aucun salaire enregistré. Cliquez sur « Nouveau salaire » pour commencer.</td></tr>'}</table></div></div>`;
  };
})();
</script>
